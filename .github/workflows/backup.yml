# A weekly backup of the live database, encrypted, for free.
#
# WHY THIS EXISTS. The Supabase free plan takes no backups at all. This database
# holds real pastoral conversations, prayer requests, safeguarding reports and
# the record of every disciplinary decision. One bad migration and it is simply
# gone, with nothing to restore from. Supabase Pro adds seven days of daily
# backups for $25 a month; this does a weekly one for nothing.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE RULE THAT MATTERS MORE THAN THE BACKUP ITSELF
#
# THIS REPOSITORY IS PUBLIC, AND WORKFLOW ARTIFACTS ON A PUBLIC REPOSITORY CAN
# BE DOWNLOADED BY ANYONE ON THE INTERNET. Not by collaborators — by anyone.
#
# So a plain `pg_dump` uploaded as an artifact would publish every private
# message in this church to the world, from a job whose name says "backup". That
# is not a smaller problem than having no backup; it is a much larger one.
#
# The dump is therefore encrypted with AES-256 before it is uploaded, and only
# the encrypted file ever leaves this job. Someone who downloads it gets
# ciphertext. If BACKUP_PASSPHRASE is missing, the job FAILS rather than falling
# back to an unencrypted upload — the failure mode has to be "no backup", never
# "public backup".
# ─────────────────────────────────────────────────────────────────────────────
#
# WHAT TO SET UP (Settings → Secrets and variables → Actions):
#
#   SUPABASE_DB_URL     the pooler connection string from
#                       Supabase → Project Settings → Database → Connection string
#                       (URI). This one IS a real secret — it can read everything.
#   BACKUP_PASSPHRASE   a long random passphrase. Store it somewhere you will
#                       still have if GitHub is the thing that broke — a password
#                       manager, not this repository.
#
# TO RESTORE:
#
#   gpg --decrypt --output beacon.sql beacon-<date>.sql.gpg
#   psql "$SUPABASE_DB_URL" -f beacon.sql
#
# A backup nobody has ever restored is a rumour. Try it once against a scratch
# Supabase project, so the first restore is not during an emergency.

name: backup

on:
  schedule:
    # 20:00 UTC on Sundays — after the weekend, before the week's activity.
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # The runner ships an older pg_dump than the database server, and a
      # mismatch aborts with "server version ... pg_dump version ...". Pull the
      # matching major from the PostgreSQL project's own apt repository.
      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Dump and encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail

          # A fork has no database of its own and nothing to back up. Say so and
          # stop cleanly — a fork must never inherit a red tick for not having
          # somebody else's credentials.
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "SUPABASE_DB_URL is not set — no database to back up here."
            echo "If this is the live repository, add it under Settings → Secrets."
            exit 0
          fi

          # Past this point a database IS configured, so a missing passphrase is
          # a misconfiguration rather than a fork, and it is the dangerous kind.
          # No passphrase means no encryption, and no encryption means a public
          # dump. Refuse, loudly. See the header.
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::error::BACKUP_PASSPHRASE is not set."
            echo "::error::Refusing to produce an unencrypted dump — artifacts on a public repository are downloadable by anyone."
            exit 1
          fi

          stamp="$(date -u +%Y-%m-%d)"
          plain="beacon-${stamp}.sql"

          # --no-owner / --no-privileges so the dump restores into a fresh
          # project without fighting over roles that do not exist there.
          pg_dump "${SUPABASE_DB_URL}" \
            --no-owner --no-privileges --format=plain --file="${plain}"

          # A dump that failed halfway can still leave a small file behind, and
          # uploading that is worse than uploading nothing because it looks like
          # a backup. 10 KB is far below any real dump of this schema.
          size=$(stat -c%s "${plain}")
          echo "Dump is ${size} bytes."
          if [ "${size}" -lt 10240 ]; then
            echo "::error::Dump is implausibly small (${size} bytes) — treating as a failure."
            exit 1
          fi

          # Encrypt, then destroy the plaintext before anything can pick it up.
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "${BACKUP_PASSPHRASE}" \
            --output "${plain}.gpg" "${plain}"
          shred -u "${plain}" 2>/dev/null || rm -f "${plain}"

          test -f "${plain}.gpg"
          echo "Encrypted backup ready: ${plain}.gpg"

          # Belt and braces: if a plaintext .sql somehow survives, fail rather
          # than let the upload step take it.
          if ls ./*.sql >/dev/null 2>&1; then
            echo "::error::A plaintext .sql is still present. Refusing to upload."
            exit 1
          fi

      # Only *.sql.gpg is ever uploaded. Ninety days is the GitHub maximum and
      # gives a full quarter of weekly restore points.
      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: beacon-backup
          path: '*.sql.gpg'
          retention-days: 90
          if-no-files-found: error
